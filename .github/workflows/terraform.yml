name: terraform

# PR   -> checagens + plan comentado na PR (papel só leitura: lê o estado, não trava nem grava).
# main -> checagens + plan salvo -> apply DESSE plan, sozinho, SE o plan só cria/altera.
#         Se o plan apaga ou recria qualquer coisa, o apply PARA. Só o Denis libera, rodando
#         "Run workflow" com permitir_destruicao = sim (o Claude nunca usa essa opção).

on:
  pull_request:
    paths: ["live/**", ".github/workflows/terraform.yml", ".tflint.hcl"]
  push:
    branches: [main]
    paths: ["live/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      permitir_destruicao:
        description: "Liberar plan que apaga/recria recurso (só o Denis)"
        type: choice
        options: ["nao", "sim"]
        default: "nao"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.7"
  AWS_REGION: sa-east-1
  STACK: live/management

jobs:
  checagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        working-directory: ${{ env.STACK }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: live
          framework: terraform
          soft_fail: false
          quiet: true
      - name: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: live
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    needs: checagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/axiomgo-github-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: init
        working-directory: ${{ env.STACK }}
        run: terraform init -input=false -backend-config="bucket=axiomgo-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
      - name: plan
        working-directory: ${{ env.STACK }}
        run: |
          terraform plan -input=false -lock=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: comentar plan na PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`${process.env.STACK}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (cortado)';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `### plan \`${process.env.STACK}\`\n\`\`\`\n${plan}\n\`\`\``,
            });
      - name: guardar plan revisado
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: ${{ env.STACK }}/tfplan
          retention-days: 7

  # Repositório privado fora do Enterprise: o GitHub não aplica "Required reviewers".
  # A trava é a checagem "sem destruição" abaixo, sobre o plan que será aplicado.
  apply:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: management
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/axiomgo-github-apply
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: ${{ env.STACK }}
      - name: init
        working-directory: ${{ env.STACK }}
        run: terraform init -input=false -backend-config="bucket=axiomgo-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
      - name: trava - plan não pode apagar nem recriar
        working-directory: ${{ env.STACK }}
        env:
          PERMITIR: ${{ inputs.permitir_destruicao }}
        run: |
          terraform show -json tfplan > plan.json
          DESTROI=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)
          echo "recursos que seriam apagados ou recriados: $DESTROI"
          jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "  - \(.address) \(.change.actions)"' plan.json
          if [ "$DESTROI" -gt 0 ] && [ "$PERMITIR" != "sim" ]; then
            echo "::error::O plan apaga ou recria $DESTROI recurso(s). Parado. Só o Denis libera: Run workflow com permitir_destruicao = sim."
            exit 1
          fi
      - name: apply do plan revisado
        working-directory: ${{ env.STACK }}
        run: terraform apply -input=false -lock-timeout=5m tfplan
